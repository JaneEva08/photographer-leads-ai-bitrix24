# Loki в режиме «всё в одном процессе», хранение на диске. Для одного сервера и небольших проектов этого хватает.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # логи хранятся 14 дней, потом удаляются сами: диск не переполнится,
  # и персональные данные (если вдруг просочатся) не лежат вечно
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# не отправлять статистику использования в Grafana Labs
analytics:
  reporting_enabled: false
